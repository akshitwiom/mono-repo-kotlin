[versions]
# --- Platform & Language ---
agp                          = "8.9.1"
kotlin                       = "2.1.21"
ksp                          = "2.1.21-2.0.1"
compileSdk                   = "36"
minSdk                       = "23"
targetSdk                    = "36"

# --- Compose ---
composeBom                   = "2025.05.01"

# --- AndroidX / Jetpack ---
coreKtx                      = "1.16.0"
lifecycle                    = "2.10.0"
activityCompose              = "1.12.0"
navigationCompose            = "2.9.0"
room                         = "2.7.1"
datastore                    = "1.1.4"
paging                       = "3.3.6"
workManager                  = "2.10.0"
hiltNavigationCompose        = "1.3.0"
startup                      = "1.2.0"
profileInstaller             = "1.4.1"
benchmark                    = "1.3.4"
splashscreen                 = "1.0.1"

# --- DI ---
hilt                         = "2.56.2"

# --- Networking ---
retrofit                     = "3.0.0"
okhttp                       = "4.12.0"

# --- Serialization ---
kotlinxSerializationJson     = "1.8.1"
kotlinxCoroutines            = "1.10.2"
kotlinxDatetime              = "0.6.2"
kotlinxCollectionsImmutable  = "0.3.8"

# --- Image Loading ---
coil                         = "3.2.0"

# --- Logging ---
timber                       = "5.0.1"

# --- Security ---
securityCrypto               = "1.1.0-alpha06"

# --- Testing ---
junit                        = "4.13.2"
junitExt                     = "1.2.1"
espresso                     = "3.6.1"
mockk                        = "1.14.2"
turbine                      = "1.2.0"
truth                        = "1.4.4"
robolectric                  = "4.14.1"
leakCanary                   = "2.14"

# --- Code Quality ---
detekt                       = "1.23.8"


[libraries]
# --- Core ---
androidx-core-ktx                  = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose           = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-splashscreen               = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-startup                    = { module = "androidx.startup:startup-runtime", version.ref = "startup" }
androidx-profileinstaller           = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileInstaller" }

# --- Compose (BOM-managed) ---
compose-bom                        = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui                         = { module = "androidx.compose.ui:ui" }
compose-ui-graphics                = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling                 = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview         = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-manifest           = { module = "androidx.compose.ui:ui-test-manifest" }
compose-ui-test-junit4             = { module = "androidx.compose.ui:ui-test-junit4" }
compose-material3                  = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended    = { module = "androidx.compose.material:material-icons-extended" }
compose-runtime                    = { module = "androidx.compose.runtime:runtime" }
compose-foundation                 = { module = "androidx.compose.foundation:foundation" }
compose-animation                  = { module = "androidx.compose.animation:animation" }

# --- Lifecycle & ViewModel ---
lifecycle-runtime-ktx              = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose          = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx            = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose        = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-savedstate     = { module = "androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }

# --- Navigation ---
navigation-compose                 = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# --- Room ---
room-runtime                       = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx                           = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler                      = { module = "androidx.room:room-compiler", version.ref = "room" }

# --- DataStore ---
datastore-preferences              = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# --- Hilt / DI ---
hilt-android                       = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler                      = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose            = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# --- Networking ---
retrofit                           = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization     = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp                             = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging                     = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

# --- Kotlin Extensions ---
kotlinx-coroutines-core            = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android         = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test            = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json         = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-datetime                   = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-collections-immutable      = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinxCollectionsImmutable" }

# --- Image Loading ---
coil-compose                       = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp                = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# --- Logging ---
timber                             = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

# --- Security ---
security-crypto                    = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }

# --- Testing ---
junit                              = { module = "junit:junit", version.ref = "junit" }
junit-ext                          = { module = "androidx.test.ext:junit", version.ref = "junitExt" }
espresso-core                      = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
mockk                              = { module = "io.mockk:mockk", version.ref = "mockk" }
turbine                            = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
truth                              = { module = "com.google.truth:truth", version.ref = "truth" }
robolectric                        = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
leakcanary                         = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakCanary" }


# --- Build Logic (Gradle Plugin artifacts for convention plugins) ---
android-gradlePlugin                = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin                 = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin                = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin                    = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }


[bundles]
compose = [
    "compose-ui",
    "compose-ui-graphics",
    "compose-ui-tooling-preview",
    "compose-material3",
    "compose-material-icons-extended",
    "compose-runtime",
    "compose-foundation",
    "compose-animation",
]

compose-debug = [
    "compose-ui-tooling",
    "compose-ui-test-manifest",
]

lifecycle = [
    "lifecycle-runtime-ktx",
    "lifecycle-runtime-compose",
    "lifecycle-viewmodel-ktx",
    "lifecycle-viewmodel-compose",
    "lifecycle-viewmodel-savedstate",
]

networking = [
    "retrofit",
    "retrofit-kotlinx-serialization",
    "okhttp",
]

testing = [
    "junit",
    "mockk",
    "turbine",
    "truth",
    "kotlinx-coroutines-test",
]

android-testing = [
    "junit-ext",
    "espresso-core",
    "compose-ui-test-junit4",
]


[plugins]
android-application  = { id = "com.android.application", version.ref = "agp" }
android-library      = { id = "com.android.library", version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm           = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt                 = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp                  = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room                 = { id = "androidx.room", version.ref = "room" }
